<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financeiro - Pessoal</title>
<meta name="theme-color" content="#F3F4F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pessoal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://script.google.com https://*.googleusercontent.com; connect-src 'self'; manifest-src 'self'; worker-src 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Casca do app pessoal (separada da casca do Financeiro da loja): só a moldura. Os dados ficam no app, protegidos pelo aparelho autorizado. */
:root{--bg:#F3F4F7;--text:#1B1B2F;--text-2:#6B6B80;--surface:#fff;--line:#E7E7EF}
@media (prefers-color-scheme:dark){:root{--bg:#0E0F14;--text:#ECECF3;--text-2:#A3A3B5;--surface:#171920;--line:#2A2C37}}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#aviso{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.14)}
#aviso[hidden]{display:none}#aviso .t{flex:1}#aviso small{display:block;color:var(--text-2)}
#aviso button{border:0;border-radius:10px;height:40px;padding:0 14px;font:inherit;font-weight:600;background:var(--text);color:var(--bg)}
</style>
</head>
<body>
<iframe id="app" title="Financeiro - Pessoal" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
<div id="aviso" role="status" hidden><div class="t"><b>O app não abriu aqui</b><small>Abra direto no navegador.</small></div><button id="abrir" type="button">Abrir</button></div>
<script>
(function () {
'use strict';
var APP = 'https://script.google.com/macros/s/AKfycbwXlDVTNh9iBP7nC5SS9ehbR731WGr6YAFkXP5DRJfDPP3PC4CqrjNvcB7w5oVxBt8/exec';
document.getElementById('app').src = APP;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
var respondeu = false;
window.addEventListener('message', function (ev) {
  if (/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/.test(ev.origin) && ev.data && ev.data.fp === 1) respondeu = true;
});
setTimeout(function () {
  if (respondeu) return;
  document.getElementById('aviso').hidden = false;
  document.getElementById('abrir').onclick = function () { location.href = APP; };
}, 15000);
})();
</script>
</body>
</html>
