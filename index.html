<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financeiro - Pessoal</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pessoal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://script.google.com https://*.googleusercontent.com; connect-src 'self'; manifest-src 'self'; worker-src 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Casca do app pessoal: só a moldura. Guarda a chave do aparelho (aqui o iPhone não apaga) e pinta a faixa
   de cima (relógio, Wi-Fi) da mesma cor do app, clara ou escura. */
:root{--bg:#F5F5F7;--text:#1D1D1F;--text-2:#6E6E73;--surface:#fff;--line:rgba(60,60,67,.12)}
:root.escuro{--bg:#0B0C0E;--text:#F2F2F3;--text-2:#A1A1A8;--surface:#16181B;--line:rgba(255,255,255,.08)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;transition:background-color .25s ease}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:var(--bg)}
#aviso{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.14)}
#aviso[hidden]{display:none}#aviso .t{flex:1}#aviso small{display:block;color:var(--text-2)}
#aviso button{border:0;border-radius:10px;height:40px;padding:0 14px;font:inherit;font-weight:600;background:var(--text);color:var(--bg)}
/* pedido de notificação: o iPhone só deixa pedir com um toque nesta página (a de cima), então a casca mostra o botão */
:root{--acc:#4F6F3A;--acc-soft:rgba(79,111,58,.12)}:root.escuro{--acc:#9DBB7E;--acc-soft:rgba(157,187,126,.16)}
#nt{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.32);opacity:0;transition:opacity .25s ease}
#nt[hidden]{display:none}#nt.on{opacity:1}
#nt .c{width:100%;max-width:440px;margin:0 12px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-radius:28px;padding:26px 22px 18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translateY(40px);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
#nt.on .c{transform:none}
#nt .s{width:60px;height:60px;margin:0 auto 12px;border-radius:18px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
#nt h2{margin:0 0 6px;font-size:21px;letter-spacing:-.02em}#nt p{margin:0 0 18px;color:var(--text-2);font-size:15px;line-height:1.45}
#nt button{display:block;width:100%;height:50px;border:0;border-radius:999px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
#nt button:focus{outline:none}#nt button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}#nt .sim{background:var(--acc);color:#fff}:root.escuro #nt .sim{color:#0B0C0E}#nt .nao{background:none;color:var(--text-2);margin-top:4px}
</style>
<script>
/* tema escolhido no app (guardado aqui), aplicado antes de pintar para o topo não piscar */
(function () {
  var esc = false;
  try { var t = localStorage.getItem('fp_casca_tema'); esc = t === 'escuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { }
  if (esc) document.documentElement.className = 'escuro';
  // a cor do topo já nasce certa: o iPhone lê estas duas marcas ao abrir o app
  document.write('<meta name="theme-color" content="' + (esc ? '#0B0C0E' : '#F5F5F7') + '"><meta name="color-scheme" content="' + (esc ? 'dark' : 'light') + '">');
})();
</script>
</head>
<body>
<iframe id="app" title="Financeiro - Pessoal" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
<div id="nt" hidden role="dialog" aria-modal="true" aria-labelledby="nt-t"><div class="c"><div class="s" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 1112 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 004 0"/></svg></div><h2 id="nt-t">Ativar notificações</h2><p id="nt-p">Na próxima tela, toque em <b>Permitir</b>. É assim que chegam os avisos de cada aporte e o resumo do mês.</p><button type="button" class="sim" id="nt-sim">Continuar</button><button type="button" class="nao" id="nt-nao">Agora não</button></div></div>
<div id="aviso" role="status" hidden><div class="t"><b>O app não abriu aqui</b><small>Abra direto no navegador.</small></div><button id="abrir" type="button">Abrir</button></div>
<script>
(function () {
'use strict';
var APP = 'https://script.google.com/macros/s/AKfycbwXlDVTNh9iBP7nC5SS9ehbR731WGr6YAFkXP5DRJfDPP3PC4CqrjNvcB7w5oVxBt8/exec';
var $ = function (id) { return document.getElementById(id); };
function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function gravar(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
function pintar() {
  var escuro = document.documentElement.className === 'escuro', cor = escuro ? '#0B0C0E' : '#F5F5F7';
  // trocar a marca inteira (e não só o valor): é o que faz o iPhone repintar o topo na hora
  Array.prototype.forEach.call(document.querySelectorAll('meta[name=theme-color],meta[name=color-scheme]'), function (m) { m.remove(); });
  var a = document.createElement('meta'); a.name = 'theme-color'; a.content = cor; document.head.appendChild(a);
  var b = document.createElement('meta'); b.name = 'color-scheme'; b.content = escuro ? 'dark' : 'light'; document.head.appendChild(b);
  document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
  document.body && (document.body.style.backgroundColor = cor);
}
pintar();
var ESCURO_INICIAL = document.documentElement.className === 'escuro';
$('app').src = APP;
// tocou numa notificação com o app fechado: o alvo vem no endereço e vai para o app quando ele estiver pronto
var ABRIR = null;
try { var mh = /#abrir=([^&]+)/.exec(location.hash); if (mh) { ABRIR = JSON.parse(decodeURIComponent(mh[1])); history.replaceState(null, '', location.pathname + location.search); } } catch (e) { ABRIR = null; }
try { var sa = sessionStorage.getItem('fp_abrir'); if (sa) { sessionStorage.removeItem('fp_abrir'); if (!ABRIR) ABRIR = JSON.parse(sa); } } catch (e) { }
var ABRIR_ENVIADO = null;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
// altura da barrinha do iPhone: o app dentro da moldura não enxerga, então a casca mede e avisa
function insetBaixo() { var e = document.createElement('div'); e.style.cssText = 'position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden'; document.body.appendChild(e); var v = parseFloat(getComputedStyle(e).paddingBottom) || 0; e.remove(); return v; }
var respondeu = false, janela = null, origem = null;
window.addEventListener('message', function (ev) {
  var m = ev.data;
  if (!/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/.test(ev.origin) || !m || m.fp !== 1) return;
  try { if (!ev.source || ev.source.top !== window) return; } catch (e) { return; }   // só o app que está DENTRO desta moldura
  respondeu = true; $('aviso').hidden = true; janela = ev.source; origem = ev.origin;
  if (m.tipo === 'app-pronto') {
    janela.postMessage({ fp: 1, tipo: 'casca', inset: { b: insetBaixo() }, chave: ler('fp_casca_chave') }, origem);
    if (ABRIR) { var a = ABRIR; ABRIR = null; ABRIR_ENVIADO = { a: a, t: Date.now() }; setTimeout(function () { if (janela) janela.postMessage({ fp: 1, tipo: 'abrir', alvo: a }, origem); }, 300); }
  } else if (m.tipo === 'sessao') {
    if (m.token === null) gravar('fp_casca_chave', null);
    else if (typeof m.token === 'string' && m.token.length < 4000) gravar('fp_casca_chave', m.token);
  } else if (m.tipo === 'notif-estado') {
    estadoNotif().then(function (e) { responder(m.req, e); });
  } else if (m.tipo === 'notif-pedir') {
    pedirNotif(m.req, String(m.vapid || ''));
  } else if (m.tipo === 'notif-desligar') {
    desligarNotif().then(function (e) { responder(m.req, e); });
  } else if (m.tipo === 'tema') {
    gravar('fp_casca_tema', m.pref === 'escuro' || m.pref === 'claro' ? m.pref : 'auto');
    document.documentElement.className = m.escuro ? 'escuro' : ''; pintar();
    // o iPhone só lê a cor do topo quando a página carrega: se o tema mudou, a moldura recarrega sozinha
    // (com uma cortina da cor nova, para não piscar). No máximo uma vez a cada 15 s, para nunca entrar em ciclo.
    if (!!m.escuro !== ESCURO_INICIAL) {
      var ult = 0; try { ult = +(sessionStorage.getItem('fp_recarga') || 0); } catch (e) { }
      if (Date.now() - ult > 15000) {
        try { sessionStorage.setItem('fp_recarga', String(Date.now())); } catch (e) { }
        var cort = document.createElement('div');
        cort.style.cssText = 'position:fixed;inset:0;z-index:9;background:' + (m.escuro ? '#0B0C0E' : '#F5F5F7') + ';opacity:0;transition:opacity .35s ease';
        document.body.appendChild(cort); requestAnimationFrame(function () { cort.style.opacity = '1'; });
        // se acabou de abrir por uma notificação, a história reabre depois da recarga
        try { if (ABRIR_ENVIADO && Date.now() - ABRIR_ENVIADO.t < 15000) sessionStorage.setItem('fp_abrir', JSON.stringify(ABRIR_ENVIADO.a)); } catch (e) { }
        setTimeout(function () { location.reload(); }, 380);
      }
    }
  }
});
/* ------------------------------------------------------------ notificações --- */
var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var INSTALADO = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
var SUPORTE = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function responder(req, dados) { if (!janela) return; var r = { fp: 1, tipo: 'notif', req: req }; for (var k in dados) r[k] = dados[k]; janela.postMessage(r, origem); }
function registro() {   // o service worker pronto, sem ficar preso se algo der errado
  return new Promise(function (ok, falha) { var t = setTimeout(function () { falha(new Error('sw')); }, 6000); navigator.serviceWorker.ready.then(function (r) { clearTimeout(t); ok(r); }); });
}
function estadoNotif() {
  var e = { suporte: SUPORTE, ios: IOS, standalone: INSTALADO, permissao: SUPORTE ? Notification.permission : 'indisponivel', sub: null };
  if (!SUPORTE) return Promise.resolve(e);
  return registro().then(function (r) { return r.pushManager.getSubscription(); }).then(function (s) { e.sub = s ? JSON.parse(JSON.stringify(s)) : null; return e; }).catch(function () { return e; });
}
function bytesDe(b64) { b64 = b64.replace(/-/g, '+').replace(/_/g, '/'); while (b64.length % 4) b64 += '='; var s = atob(b64), o = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o; }
function mesmaChave(a, b) { if (!a || a.byteLength !== b.length) return false; a = new Uint8Array(a); for (var i = 0; i < b.length; i++) if (a[i] !== b[i]) return false; return true; }
function assinar(vapid) {
  var chave = bytesDe(vapid);
  return registro().then(function (r) {
    return r.pushManager.getSubscription().then(function (s) {
      if (s && s.options && mesmaChave(s.options.applicationServerKey, chave)) return s;
      return (s ? s.unsubscribe() : Promise.resolve()).then(function () { return r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chave }); });
    });
  });
}
function concluir(req, vapid) {
  return assinar(vapid).then(function (s) { return estadoNotif().then(function (e) { e.sub = JSON.parse(JSON.stringify(s)); responder(req, e); }); });
}
function fecharNt() { var n = $('nt'); n.classList.remove('on'); setTimeout(function () { n.hidden = true; }, 260); }
function pedirNotif(req, vapid) {
  if (!SUPORTE || !/^[A-Za-z0-9_-]{80,100}$/.test(vapid)) return estadoNotif().then(function (e) { e.erro = 'Este aparelho não recebe notificações aqui.'; responder(req, e); });
  if (Notification.permission === 'denied') return estadoNotif().then(function (e) { responder(req, e); });
  if (Notification.permission === 'granted') return concluir(req, vapid).catch(function () { mostrar(); });
  mostrar();
  function mostrar() {
    var n = $('nt'); n.hidden = false; requestAnimationFrame(function () { n.classList.add('on'); });
    $('nt-nao').onclick = function () { fecharNt(); responder(req, { cancelou: true }); };
    $('nt-sim').onclick = function () {
      // pedido direto no toque: é o que o iPhone exige
      var p;
      try { p = Notification.requestPermission(); } catch (e) { p = null; }
      Promise.resolve(p).then(function (perm) {
        fecharNt();
        perm = perm || Notification.permission;
        if (perm !== 'granted') return estadoNotif().then(function (e) { if (perm === 'default') e.cancelou = true; responder(req, e); });
        return concluir(req, vapid);
      }).catch(function (err) { fecharNt(); estadoNotif().then(function (e) { e.erro = 'Não consegui ativar: ' + (err && err.message ? err.message : 'erro desconhecido'); responder(req, e); }); });
    };
  }
}
function desligarNotif() {
  if (!SUPORTE) return estadoNotif();
  return registro().then(function (r) { return r.pushManager.getSubscription(); }).then(function (s) { return s ? s.unsubscribe() : true; }).catch(function () { }).then(estadoNotif);
}
// tocou numa notificação com o app aberto: o service worker avisa aqui e a casca passa para o app
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (ev) {
  var m = ev.data; if (!m || m.fp !== 1 || m.tipo !== 'abrir') return;
  if (janela) janela.postMessage({ fp: 1, tipo: 'abrir', alvo: m.alvo }, origem); else ABRIR = m.alvo;
});
setTimeout(function () {
  if (respondeu) return;
  $('aviso').hidden = false;
  $('abrir').onclick = function () { location.href = APP; };
}, 15000);
})();
</script>
</body>
